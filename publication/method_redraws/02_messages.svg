   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle" x="253.44" y="20.617412" transform="rotate(-0 253.44 20.617412)">CAAA messages in a one-process simulation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(67.620781 72.268031)">Five simulated clients</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(43.164531 84.299281)">Local TRAIN labels and updates</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(35.546562 98.268031)">Local monitor and outer validation</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(50.767656 110.299281)">Local target scaling and q80</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(341.679531 72.114125)">Parameter server</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(298.610781 84.299281)">Additive normalized CAAA weights</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(332.89125 98.268031)">Size + monitor score</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(304.392812 111.268031)">+ fixed TRAIN climate relevance</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(88.433125 163.51423)">Each round: states, scalar losses and fixed TRAIN strengths.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(112.906406 178.91423)">Broadcast the global model at each training round.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(52.645 245.479372)">One-time TRAIN summaries</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(23.340312 257.510622)">Sample count; input sum, squared sum</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(41.587969 271.086403)">Two local ENSO/IOD correlations</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(317.67875 244.510622)">Shared input mean and SD</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(308.158437 258.479372)">Climate correlation summaries</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(322.485781 270.510622)">Plain numerical payloads</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(123.847969 331.231877)">Upload input statistics and climate summaries.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(143.543125 346.631877)">Broadcast the input mean and SD once.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(99.293906 391.785412)">No secure aggregation or differential privacy is implemented.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(91.9525 405.785412)">Graph controls separately require aligned TRAIN rainfall sharing.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(91.193906 419.785412)">Central and static-router controls use declared raw-data pooling.</text>
   </g>
  </g>

   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(68.593359 125.444531)">Bidirectional LSTM</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(36.326367 136.817344)">2 layers; 48 units per direction</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(51.947578 149.686406)">12 hidden states hⱼ of 96</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(297.296836 131.639531)">Climate MLP: 7 → 32 → 16</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(286.742695 143.012344)">Embedding e with tanh layers</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(160.13918 204.748359)">Joint attention: [hⱼ, e] → 32 → 1</text>

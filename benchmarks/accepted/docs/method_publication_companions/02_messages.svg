   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202020" x="241.2" y="20.816406" transform="rotate(-0 241.2 20.816406)">CAAA messages in a one-process simulation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(60.14332 58.769531)">Five simulated clients</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(34.464258 70.142344)">Local TRAIN labels and updates</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(26.465391 83.549531)">Local monitor and outer validation</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(42.447539 94.922344)">Local target scaling and q80</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(319.798008 58.60793)">Parameter server</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(274.57582 70.142344)">Additive normalized CAAA weights</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(291.053438 82.532344)">Size + monitor performance</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(280.646953 95.939531)">+ fixed TRAIN climate relevance</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(82.024102 134.942344)">Each round: states, scalar monitoring/validation diagnostics,</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(67.486523 147.332344)">and two fixed whole-TRAIN strengths. Broadcast the global model.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(44.41875 186.569531)">One-time TRAIN summaries</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(51.048516 197.942344)">Sample count; input sum</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(44.488477 210.332344)">and squared sum; two local</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(58.222969 223.326914)">ENSO/IOD correlations</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(294.597188 191.747344)">Shared input mean and SD</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(284.600859 205.154531)">Climate correlation summaries</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(299.64457 216.527344)">Plain numerical payloads</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(117.498516 253.742344)">Upload input statistics and climate summaries.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(136.298438 266.132344)">Broadcast the input mean and SD once.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(91.283789 293.342344)">Reporting exports: target mean and SD (16 bytes/client).</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(88.362656 305.732344)">TRAIN q80 appears in schema and evaluation diagnostics.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202020" x="241.2" y="342.737344" transform="rotate(-0 241.2 342.737344)">Primary aggregation coefficients: (1, 0, 0); anchor: (0.3, 0.3, 0.4).</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(79.346602 369.947344)">No secure aggregation or differential privacy is implemented.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(71.638125 382.337344)">Graph controls separately require aligned TRAIN rainfall sharing.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(70.841602 394.727344)">Central and static-router controls use declared raw-data pooling.</text>
   </g>
  </g>

name: Implementation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install reference direct dependencies
        run: |
          python -m pip install "setuptools>=68"
          python -m pip install "torch==2.14.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check implementation invariants
        run: python -m unittest discover -s tests -v
      - name: Prepare finite revision inputs and check numerical contracts
        run: python tools/reproduce_revision_v3.py prepare
